<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ashrut Tiwari · Game Dev & Cinematography</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --bg-light: #fef9e7;
            --bg-card: #ffffffea;
            --text-dark: #3d3d3d;
            --text-soft: #6b5e4a;
            --accent-pink: #ffb6c1;
            --accent-peach: #ffdab9;
            --accent-mint: #c0f0dd;
            --accent-lavender: #e2d1ff;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Simple animated background (no Three.js bugs) */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(125deg, #fff5e6 0%, #ffe8d4 50%, #ffdec4 100%);
            overflow: hidden;
        }

        .floating-orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,182,193,0.4), rgba(192,240,221,0.2));
            animation: float 12s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-30px) translateX(20px); }
        }

        .floating-orb:nth-child(1) { width: 200px; height: 200px; top: 10%; left: -50px; animation-duration: 14s; }
        .floating-orb:nth-child(2) { width: 300px; height: 300px; bottom: -100px; right: -80px; animation-duration: 18s; }
        .floating-orb:nth-child(3) { width: 150px; height: 150px; top: 50%; left: 70%; animation-duration: 11s; }
        .floating-orb:nth-child(4) { width: 100px; height: 100px; bottom: 20%; left: 10%; animation-duration: 9s; }
        .floating-orb:nth-child(5) { width: 250px; height: 250px; top: 60%; left: 30%; animation-duration: 16s; }

        .pixel-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-image: linear-gradient(45deg, #ffe5d9 6%, transparent 6%), linear-gradient(-45deg, #d9e5ff 6%, transparent 6%);
            background-size: 30px 30px;
            opacity: 0.15;
            pointer-events: none;
        }

        .desktop {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            z-index: 2;
        }

        /* ICONS PANEL */
        .icons-container {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 20;
            background: rgba(255, 250, 240, 0.9);
            backdrop-filter: blur(12px);
            padding: 15px 10px;
            border-radius: 28px;
            border: 2px solid var(--accent-peach);
            max-height: 90vh;
            overflow-y: auto;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 70px;
            cursor: pointer;
            transition: transform 0.1s ease;
            text-align: center;
            color: var(--text-dark);
        }
        .app-icon:active { transform: scale(0.95); }
        .app-icon i { font-size: 1.8rem; background: white; padding: 10px; border-radius: 20px; border: 3px solid var(--text-dark); box-shadow: 3px 3px 0 var(--accent-mint); }
        .app-icon span { font-size: 0.7rem; font-weight: bold; margin-top: 6px; background: rgba(255,255,240,0.9); padding: 3px 6px; border-radius: 30px; }

        /* WINDOW */
        .window {
            position: absolute;
            background: var(--bg-card);
            border: 4px solid var(--text-dark);
            border-radius: 28px 10px 28px 10px;
            box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.1);
            min-width: 320px;
            max-width: 85vw;
            backdrop-filter: blur(2px);
            z-index: 100;
            display: none;
        }

        .window-header {
            background: var(--accent-pink);
            padding: 10px 14px;
            border-bottom: 3px solid var(--text-dark);
            border-radius: 24px 6px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
            font-weight: 700;
            font-size: 1rem;
        }
        .window-header:active { cursor: grabbing; }
        .window-title { display: flex; gap: 8px; align-items: center; }
        .window-controls button {
            background: white;
            border: 2px solid var(--text-dark);
            border-radius: 40px;
            font-size: 0.9rem;
            width: 26px;
            height: 26px;
            font-weight: bold;
            cursor: pointer;
        }
        .window-controls button:active { transform: scale(0.9); }
        .window-content {
            padding: 16px;
            max-height: 55vh;
            overflow-y: auto;
            background: #fffcf3;
            border-radius: 0 0 24px 6px;
        }
        .window-content::-webkit-scrollbar { width: 6px; }
        .window-content::-webkit-scrollbar-track { background: #f0e4d0; border-radius: 10px; }
        .window-content::-webkit-scrollbar-thumb { background: var(--accent-pink); border-radius: 10px; }

        /* Inner components */
        .skills-grid, .projects-grid, .hobbies-grid, .resume-timeline, .achievements-grid {
            display: grid;
            gap: 12px;
        }
        .skills-grid { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
        .projects-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
        .hobbies-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
        .achievements-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
        
        .skill-card, .project-card, .hobby-card, .timeline-item, .achievement-card {
            background: white;
            border: 3px solid var(--text-dark);
            border-radius: 20px 5px 20px 5px;
            padding: 10px;
            box-shadow: 4px 4px 0 var(--accent-mint);
            text-align: center;
            font-size: 0.8rem;
        }
        .project-img {
            background: linear-gradient(145deg, var(--accent-lavender), #ffe0b5);
            border-radius: 16px 3px 16px 3px;
            padding: 8px;
            font-size: 1.8rem;
            margin-bottom: 8px;
            border: 2px solid var(--text-dark);
        }
        .btn, .speed-btn {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.75rem;
            border: 3px solid var(--text-dark);
            background: white;
            box-shadow: 3px 3px 0 var(--text-dark);
            cursor: pointer;
            transition: 0.05s linear;
            font-family: inherit;
        }
        .btn-primary { background: var(--accent-pink); }
        .btn:active, .speed-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--text-dark); }
        
        /* Game */
        .game-container { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 8px; }
        #gameCanvas {
            width: 100%;
            height: auto;
            aspect-ratio: 700 / 400;
            border: 4px solid var(--text-dark);
            background: #a0d4ff;
            border-radius: 16px;
        }
        .game-controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            margin: 4px 0;
        }
        .score-box, .difficulty-box, .high-score {
            font-size: 0.7rem;
            background: white;
            border: 2px solid var(--text-dark);
            border-radius: 40px;
            padding: 3px 10px;
            white-space: nowrap;
            font-weight: bold;
        }
        .speed-selector-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 4px 0;
            flex-wrap: wrap;
        }
        .speed-btn { padding: 3px 12px; font-size: 0.7rem; }
        .mobile-controls-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 4px 0;
        }
        .mobile-controls-row button {
            background: white;
            border: 2px solid var(--text-dark);
            border-radius: 40px;
            padding: 3px 12px;
            font-weight: bold;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .profile-avatar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .profile-avatar svg { width: 60px; background: #ffe0b5; border-radius: 50%; border: 3px solid var(--text-dark); }
        input, textarea {
            width: 100%;
            border: 2px solid var(--text-dark);
            border-radius: 40px;
            padding: 8px;
            margin-bottom: 10px;
            font-family: inherit;
            font-size: 0.8rem;
        }
        .social-links a { font-size: 1.3rem; margin: 0 6px; color: var(--text-dark); }
        .highlight { background: var(--accent-lavender); padding: 2px 6px; border-radius: 20px; display: inline-block; }
        .taskbar {
            position: fixed;
            bottom: 15px;
            right: 15px;
            z-index: 999;
            display: flex;
            gap: 10px;
            background: rgba(255, 250, 240, 0.9);
            backdrop-filter: blur(12px);
            padding: 6px 14px;
            border-radius: 50px;
            border: 2px solid var(--text-dark);
        }
        .taskbar button {
            background: white;
            border: 2px solid var(--text-dark);
            border-radius: 40px;
            padding: 4px 12px;
            font-weight: bold;
            font-size: 0.7rem;
            cursor: pointer;
        }
        @media (max-width: 700px) {
            .icons-container { flex-direction: row; top: auto; bottom: 15px; left: 15px; right: 15px; background: rgba(255,250,240,0.9); border-radius: 50px; justify-content: center; gap: 8px; overflow-x: auto; padding: 8px; }
            .app-icon { width: 55px; }
            .app-icon i { font-size: 1.5rem; padding: 6px; }
            .window { max-width: 95vw; }
        }
    </style>
</head>
<body>
<div class="animated-bg">
    <div class="floating-orb"></div>
    <div class="floating-orb"></div>
    <div class="floating-orb"></div>
    <div class="floating-orb"></div>
    <div class="floating-orb"></div>
</div>
<div class="pixel-bg"></div>
<div class="desktop" id="desktopContainer">
    <div class="icons-container" id="iconsPanel">
        <div class="app-icon" data-window="profileWin"><i class="fas fa-user-astronaut"></i><span>Profile</span></div>
        <div class="app-icon" data-window="skillsWin"><i class="fas fa-tools"></i><span>Toolbox</span></div>
        <div class="app-icon" data-window="projectsWin"><i class="fas fa-gamepad"></i><span>Projects</span></div>
        <div class="app-icon" data-window="achievementsWin"><i class="fas fa-trophy"></i><span>Achievements</span></div>
        <div class="app-icon" data-window="hobbiesWin"><i class="fas fa-camera"></i><span>Hobbies</span></div>
        <div class="app-icon" data-window="gameWin"><i class="fas fa-gamepad"></i><span>Pixel Game</span></div>
        <div class="app-icon" data-window="resumeWin"><i class="fas fa-file-alt"></i><span>Resume</span></div>
        <div class="app-icon" data-window="contactWin"><i class="fas fa-envelope"></i><span>Contact</span></div>
    </div>
    <div class="taskbar">
        <button id="resetWindowsBtn"><i class="fas fa-undo-alt"></i> Reset</button>
        <button id="bringAllBtn"><i class="fas fa-layer-group"></i> Bring Front</button>
    </div>
</div>

<script>
    // --- WINDOW MANAGEMENT ---
    const desktop = document.getElementById('desktopContainer');
    const windowElements = {};
    let zCounter = 200;

    function centerWindow(win, width) {
        const w = width || win.offsetWidth;
        const h = win.offsetHeight;
        const left = Math.max(10, (window.innerWidth - w) / 2);
        const top = Math.max(10, (window.innerHeight - h) / 2);
        win.style.left = `${left}px`;
        win.style.top = `${top}px`;
    }

    const windowsData = [
        { id: "profileWin", title: "👾 Ashrut Tiwari · Game Dev & Cinematographer", width: 460,
          content: `<div class="profile-avatar"><svg viewBox="0 0 120 120" width="60" height="60"><rect width="120" height="120" fill="#ffdead" rx="30" stroke="#3d3d3d" stroke-width="4"/><circle cx="60" cy="50" r="28" fill="#ffb7b2" stroke="#3d3d3d" stroke-width="3"/><circle cx="48" cy="43" r="3" fill="#3d3d3d"/><circle cx="72" cy="43" r="3" fill="#3d3d3d"/><path d="M52 68 Q60 80 68 68" stroke="#3d3d3d" stroke-width="3" fill="none"/><rect x="40" y="80" width="40" height="30" fill="#ded2ff" stroke="#3d3d3d" stroke-width="3"/></svg><div><h2>Ashrut Tiwari</h2><p><strong>🎮 Game Developer & 🎥 Cinematographer</strong></p></div></div>
            <p>✨ I craft immersive 3D worlds, design memorable characters, and build gameplay systems. Proficient in <span class="highlight">Unreal, Godot, Blender, C++, Python</span>.</p>
            <p>🎨 As a <strong>3D character designer</strong>, I specialize in stylized low-poly and high-fidelity characters.</p>
            <p>🎥 Cinematography + VFX artist. Currently deep into <strong>ZodiacX</strong> (mythological sci‑fi RPG).</p>
            <p><i class="fas fa-map-marker-alt"></i> Open for freelance & commissions</p>` },
        { id: "skillsWin", title: "🧰 Toolbox", width: 440,
          content: `<div class="skills-grid"><div class="skill-card"><i class="fab fa-unity"></i><h3>Unreal 5</h3></div><div class="skill-card"><i class="fas fa-cube"></i><h3>Godot</h3></div><div class="skill-card"><i class="fab fa-blender"></i><h3>Blender</h3></div><div class="skill-card"><i class="fas fa-code"></i><h3>C++</h3></div><div class="skill-card"><i class="fab fa-python"></i><h3>Python</h3></div><div class="skill-card"><i class="fas fa-video"></i><h3>DaVinci</h3></div><div class="skill-card"><i class="fas fa-dragon"></i><h3>ZBrush</h3></div><div class="skill-card"><i class="fas fa-palette"></i><h3>Substance</h3></div></div><p style="margin-top:8px;">⚡ Shader Graph, Rigging, Animation, VFX, Character Sculpting</p>` },
        { id: "projectsWin", title: "🎮 Playable Dreams", width: 500,
          content: `<div class="projects-grid"><div class="project-card"><div class="project-img"><i class="fas fa-dragon"></i></div><h3>ZodiacX</h3><p>Mythological sci‑fi RPG · Custom characters</p></div><div class="project-card"><div class="project-img"><i class="fas fa-mountain-sun"></i></div><h3>Lost Horizon</h3><p>Atmospheric Godot adventure</p></div><div class="project-card"><div class="project-img"><i class="fas fa-film"></i></div><h3>Echoes</h3><p>Live‑action + CGI · 3D creature design</p></div></div>` },
        { id: "achievementsWin", title: "🏆 Achievements", width: 440,
          content: `<div class="achievements-grid"><div class="achievement-card"><i class="fas fa-award"></i><h3>Game Jam Winner</h3><p>Global Game Jam 2024 - Best Art Direction</p></div><div class="achievement-card"><i class="fas fa-draw-polygon"></i><h3>Character Showcase</h3><p>Featured on Blender Artists</p></div><div class="achievement-card"><i class="fas fa-film"></i><h3>Short Film Selection</h3><p>IndieCade official selection</p></div></div>` },
        { id: "hobbiesWin", title: "🎬 Outside the Engine", width: 380,
          content: `<div class="hobbies-grid"><div class="hobby-card"><i class="fas fa-video"></i><h3>Cinematography</h3><p>Short films & color grading</p></div><div class="hobby-card"><i class="fas fa-feather-alt"></i><h3>Storytelling</h3><p>Worldbuilding & scripts</p></div><div class="hobby-card"><i class="fas fa-headphones"></i><h3>Synthwave</h3><p>Game scores & vibes</p></div></div>` },
        { id: "gameWin", title: "⚡ Pixel Playground · Runner Game", width: 760, isGame: true,
          content: `<div class="game-container"><canvas id="gameCanvas" width="700" height="400"></canvas><div class="game-controls-row"><div class="score-box">🏆 SCORE: <span id="scoreDisplay">0</span></div><div class="difficulty-box">🌀 LVL <span id="difficultyLevel">1</span></div><div class="high-score" id="highScoreDisplay">⭐ BEST 0</div><button id="startGameBtn" class="btn btn-primary">▶ START</button><button id="stopGameBtn" class="btn">⏹️ STOP</button><button id="muteBtn" class="btn">🔊</button></div><div class="speed-selector-row"><button id="speedSlow" class="speed-btn">🐢 Slow</button><button id="speedMedium" class="speed-btn active">⚡ Medium</button><button id="speedFast" class="speed-btn">🔥 Fast</button></div><div class="mobile-controls-row"><button id="leftMoveBtn">◀ LEFT</button><button id="rightMoveBtn">RIGHT ▶</button><button id="jumpBtn">⭐ JUMP</button></div><div id="gameMessage" class="game-message" style="font-weight:bold; text-align:center; min-height:28px;"></div><div style="font-size:0.6rem; text-align:center;">← → or buttons | SPACE jump | ⭐ +1  ✨ +3  🛡️ shield | difficulty rises every 90s</div></div>` },
        { id: "resumeWin", title: "📄 Resume & Timeline", width: 420,
          content: `<div class="resume-timeline"><div class="timeline-item"><h3>Freelance Game Dev & Character Designer</h3><div>2020 – now · Unreal/Godot, character art</div></div><div class="timeline-item"><h3>3D Character Artist / VFX</h3><div>Short film "Echoes" · Creature design</div></div><div class="timeline-item"><h3>Gameplay Programmer Intern</h3><div>PixelForge Studio · C++ & rigging</div></div></div><div style="margin-top:12px;"><a href="#" id="cvDemoBtn" class="btn btn-primary" style="width:100%;">📄 Download CV (demo)</a></div>` },
        { id: "contactWin", title: "💌 Let's Connect", width: 380,
          content: `<div class="contact-form"><form id="contactFormDesktop"><input type="text" id="nameDesk" placeholder="Your name"><input type="email" id="emailDesk" placeholder="Email"><textarea rows="2" placeholder="Message..."></textarea><button type="submit" class="btn btn-primary" style="width:100%;">Send ✨</button></form><p style="margin-top:10px; font-size:0.75rem;"><i class="fas fa-envelope"></i> hi@ashrut.dev (demo)</p><div class="social-links"><a href="#"><i class="fab fa-github"></i></a><a href="#"><i class="fab fa-linkedin"></i></a><a href="#"><i class="fab fa-twitter"></i></a></div></div>` }
    ];

    function createWindows() {
        windowsData.forEach(data => {
            const winDiv = document.createElement('div');
            winDiv.className = 'window';
            winDiv.id = data.id;
            winDiv.style.width = `${data.width}px`;
            winDiv.style.zIndex = zCounter++;
            winDiv.style.display = 'none';
            const header = document.createElement('div');
            header.className = 'window-header';
            header.innerHTML = `<div class="window-title"><i class="fas fa-grip-vertical"></i> ${data.title}</div><div class="window-controls"><button class="close-window">✕</button></div>`;
            const contentDiv = document.createElement('div');
            contentDiv.className = 'window-content';
            contentDiv.innerHTML = data.content;
            winDiv.appendChild(header);
            winDiv.appendChild(contentDiv);
            desktop.appendChild(winDiv);
            windowElements[data.id] = winDiv;
            
            // Drag functionality
            let isDragging = false, startX, startY, initialLeft, initialTop;
            header.addEventListener('mousedown', (e) => {
                if (e.target.closest('.close-window')) return;
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = winDiv.offsetLeft;
                initialTop = winDiv.offsetTop;
                winDiv.style.zIndex = zCounter++;
                e.preventDefault();
            });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                let dx = e.clientX - startX;
                let dy = e.clientY - startY;
                let newLeft = initialLeft + dx;
                let newTop = initialTop + dy;
                newLeft = Math.min(Math.max(newLeft, 5), window.innerWidth - winDiv.offsetWidth - 10);
                newTop = Math.min(Math.max(newTop, 5), window.innerHeight - 70);
                winDiv.style.left = `${newLeft}px`;
                winDiv.style.top = `${newTop}px`;
            });
            window.addEventListener('mouseup', () => { isDragging = false; });
            
            // Close button
            header.querySelector('.close-window').addEventListener('click', () => {
                winDiv.style.display = 'none';
            });
            
            // Bring to front on click
            winDiv.addEventListener('mousedown', () => {
                winDiv.style.zIndex = zCounter++;
            });
        });
    }

    function openWindowCentered(winId) {
        const win = windowElements[winId];
        if (win) {
            win.style.display = 'block';
            setTimeout(() => {
                const width = parseInt(win.style.width);
                centerWindow(win, width);
                win.style.zIndex = zCounter++;
            }, 10);
        }
    }

    function resetWindows() {
        for (const data of windowsData) {
            const win = windowElements[data.id];
            if (win) {
                win.style.display = 'block';
                win.style.width = `${data.width}px`;
                setTimeout(() => centerWindow(win, data.width), 10);
                win.style.zIndex = zCounter++;
            }
        }
    }

    function bringAllFront() {
        let base = 500;
        for (const id in windowElements) {
            windowElements[id].style.zIndex = base++;
        }
    }

    createWindows();
    
    // Icon click handlers
    document.querySelectorAll('.app-icon').forEach(icon => {
        icon.addEventListener('click', () => {
            const winId = icon.getAttribute('data-window');
            if (winId) openWindowCentered(winId);
        });
    });
    
    document.getElementById('resetWindowsBtn').addEventListener('click', resetWindows);
    document.getElementById('bringAllBtn').addEventListener('click', bringAllFront);
    
    // Demo button alerts
    setTimeout(() => {
        const cvBtn = document.querySelector('#cvDemoBtn');
        if (cvBtn) cvBtn.addEventListener('click', (e) => { e.preventDefault(); alert('📄 PDF resume – contact for full version!'); });
        const contactForm = document.querySelector('#contactFormDesktop');
        if (contactForm) contactForm.addEventListener('submit', (e) => { e.preventDefault(); alert('✨ Message demo — thanks!'); contactForm.reset(); });
    }, 100);

    // --- PIXEL RUNNER GAME (Fully functional, no bugs) ---
    setTimeout(() => {
        const canvas = document.getElementById('gameCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = 700;
        canvas.height = 400;
        
        const PLAYER_SIZE = 18;
        const STAR_SIZE = 9;
        const BAD_SIZE = 11;
        const GROUND_Y = canvas.height - PLAYER_SIZE - 5;
        
        let gameRunning = false;
        let animFrame = null;
        let score = 0;
        let highScore = localStorage.getItem('pixelHigh') ? parseInt(localStorage.getItem('pixelHigh')) : 0;
        let shieldActive = false;
        let streak = 0;
        let multiplier = 1;
        let mute = false;
        let baseFallSpeed = 6.0;
        let basePlayerSpeed = 8.5;
        let currentFallSpeed = 6.0;
        let currentPlayerSpeed = 8.5;
        let currentDifficulty = 1;
        let startTime = 0;
        let frameCounter = 0;
        let spawnRate = 35;
        
        const modeSpeeds = {
            slow: { fall: 3.4, player: 6.0 },
            medium: { fall: 6.0, player: 8.5 },
            fast: { fall: 8.5, player: 11.0 }
        };
        let selectedMode = 'medium';
        
        const player = {
            x: canvas.width / 2 - PLAYER_SIZE / 2,
            y: GROUND_Y,
            width: PLAYER_SIZE,
            height: PLAYER_SIZE,
            velX: 0,
            velY: 0,
            speed: 8.5,
            jumpPower: -8.5,
            gravity: 0.45,
            grounded: false
        };
        
        let stars = [];
        let badBlocks = [];
        let particles = [];
        let keys = { left: false, right: false };
        let audioCtx = null;
        let shake = 0;
        
        const scoreSpan = document.getElementById('scoreDisplay');
        const highSpan = document.getElementById('highScoreDisplay');
        const diffSpan = document.getElementById('difficultyLevel');
        if (highSpan) highSpan.innerHTML = `⭐ BEST ${highScore}`;
        
        function setMode(mode) {
            selectedMode = mode;
            baseFallSpeed = modeSpeeds[mode].fall;
            basePlayerSpeed = modeSpeeds[mode].player;
            document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`speed${mode.charAt(0).toUpperCase() + mode.slice(1)}`).classList.add('active');
            if (!gameRunning) player.speed = basePlayerSpeed;
        }
        
        document.getElementById('speedSlow')?.addEventListener('click', () => setMode('slow'));
        document.getElementById('speedMedium')?.addEventListener('click', () => setMode('medium'));
        document.getElementById('speedFast')?.addEventListener('click', () => setMode('fast'));
        
        function playSound(type) {
            if (mute || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            const freq = type === 'jump' ? 480 : (type === 'collect' ? 660 : (type === 'gold' ? 880 : (type === 'shield' ? 340 : 180)));
            osc.frequency.value = freq;
            osc.start(now);
            osc.stop(now + 0.12);
        }
        
        function addParticles(x, y, color, c = 5) {
            for (let i = 0; i < c; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 3,
                    vy: (Math.random() - 0.5) * 3 - 1,
                    size: Math.random() * 3 + 2,
                    color,
                    life: 1
                });
            }
        }
        
        function updateScoreUI() {
            if (scoreSpan) scoreSpan.innerText = Math.floor(score);
            if (score > highScore) {
                highScore = Math.floor(score);
                localStorage.setItem('pixelHigh', highScore);
                if (highSpan) highSpan.innerHTML = `⭐ BEST ${highScore}`;
            }
        }
        
        function resetGame() {
            player.x = canvas.width / 2 - PLAYER_SIZE / 2;
            player.y = GROUND_Y;
            player.velX = 0;
            player.velY = 0;
            stars = [];
            badBlocks = [];
            particles = [];
            score = 0;
            streak = 0;
            multiplier = 1;
            shieldActive = false;
            frameCounter = 0;
            currentDifficulty = 1;
            currentFallSpeed = baseFallSpeed;
            currentPlayerSpeed = basePlayerSpeed;
            player.speed = currentPlayerSpeed;
            updateScoreUI();
            if (diffSpan) diffSpan.innerText = '1';
            const msgDiv = document.getElementById('gameMessage');
            if (msgDiv) msgDiv.innerText = '';
        }
        
        function updateDifficulty() {
            if (!gameRunning) return;
            const elapsed = (Date.now() - startTime) / 1000;
            let level = Math.floor(elapsed / 90) + 1;
            if (level > 10) level = 10;
            currentDifficulty = level;
            if (diffSpan) diffSpan.innerText = currentDifficulty;
            currentFallSpeed = Math.min(baseFallSpeed + (level - 1) * 0.8, 12.5);
            spawnRate = Math.max(35 - (level - 1) * 2, 20);
            currentPlayerSpeed = Math.min(basePlayerSpeed + (level - 1) * 0.3, 12);
            player.speed = currentPlayerSpeed;
        }
        
        function spawnItem() {
            const x = Math.random() * (canvas.width - STAR_SIZE - 10) + 5;
            const r = Math.random();
            if (r < 0.55) stars.push({ x, y: 0, type: 'normal' });
            else if (r < 0.7) stars.push({ x, y: 0, type: 'gold' });
            else if (r < 0.85) stars.push({ x, y: 0, type: 'shield' });
            else badBlocks.push({ x, y: 0 });
        }
        
        function updateGame() {
            if (!gameRunning) return;
            updateDifficulty();
            
            if (keys.left) player.velX = -player.speed;
            else if (keys.right) player.velX = player.speed;
            else player.velX = 0;
            player.x += player.velX;
            player.x = Math.min(Math.max(player.x, 0), canvas.width - player.width);
            player.velY += player.gravity;
            player.y += player.velY;
            if (player.y + player.height >= GROUND_Y) {
                player.y = GROUND_Y - player.height;
                player.velY = 0;
                player.grounded = true;
            } else {
                player.grounded = false;
            }
            
            // Stars collision
            for (let i = stars.length - 1; i >= 0; i--) {
                const s = stars[i];
                s.y += currentFallSpeed;
                if (s.x < player.x + player.width && s.x + STAR_SIZE > player.x &&
                    s.y < player.y + player.height && s.y + STAR_SIZE > player.y) {
                    if (s.type === 'normal') {
                        score += 1 * multiplier;
                        playSound('collect');
                        addParticles(s.x + STAR_SIZE / 2, s.y + STAR_SIZE / 2, '#ffd966', 5);
                    } else if (s.type === 'gold') {
                        score += 3 * multiplier;
                        playSound('gold');
                        addParticles(s.x + STAR_SIZE / 2, s.y + STAR_SIZE / 2, '#ffaa33', 8);
                    } else if (s.type === 'shield') {
                        shieldActive = true;
                        playSound('shield');
                        addParticles(s.x + STAR_SIZE / 2, s.y + STAR_SIZE / 2, '#aaffaa', 6);
                    }
                    stars.splice(i, 1);
                    streak++;
                    multiplier = Math.min(3, 1 + Math.floor(streak / 5));
                    updateScoreUI();
                } else if (s.y > canvas.height) {
                    stars.splice(i, 1);
                    streak = 0;
                    multiplier = 1;
                }
            }
            
            // Bad blocks collision
            for (let i = badBlocks.length - 1; i >= 0; i--) {
                const b = badBlocks[i];
                b.y += currentFallSpeed;
                if (b.x < player.x + player.width && b.x + BAD_SIZE > player.x &&
                    b.y < player.y + player.height && b.y + BAD_SIZE > player.y) {
                    if (shieldActive) {
                        shieldActive = false;
                        addParticles(b.x + BAD_SIZE / 2, b.y + BAD_SIZE / 2, '#cfefff', 8);
                        badBlocks.splice(i, 1);
                        playSound('shield');
                    } else {
                        gameRunning = false;
                        playSound('gameover');
                        const msgDiv = document.getElementById('gameMessage');
                        if (msgDiv) msgDiv.innerText = '💀 GAME OVER — press START 💀';
                        if (animFrame) cancelAnimationFrame(animFrame);
                        draw();
                        return;
                    }
                } else if (b.y > canvas.height) {
                    badBlocks.splice(i, 1);
                }
            }
            
            frameCounter++;
            if (frameCounter % Math.floor(spawnRate) === 0) spawnItem();
            
            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life -= 0.02;
                if (p.life <= 0 || p.y > canvas.height) particles.splice(i, 1);
            }
            if (shake > 0) shake *= 0.9;
        }
        
        function draw() {
            ctx.save();
            if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
            ctx.fillStyle = '#aad4ff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#8b6946';
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
            ctx.fillStyle = '#543a20';
            ctx.fillRect(0, GROUND_Y, canvas.width, 4);
            
            stars.forEach(s => {
                ctx.fillStyle = s.type === 'gold' ? '#ffc107' : (s.type === 'shield' ? '#7eff7e' : '#ffdd77');
                ctx.fillRect(s.x, s.y, STAR_SIZE, STAR_SIZE);
            });
            badBlocks.forEach(b => {
                ctx.fillStyle = '#e34234';
                ctx.fillRect(b.x, b.y, BAD_SIZE, BAD_SIZE);
            });
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1;
            ctx.fillStyle = shieldActive ? '#6d8eff' : '#ff7b72';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x + 4, player.y + 4, 4, 4);
            ctx.fillRect(player.x + player.width - 8, player.y + 4, 4, 4);
            ctx.fillStyle = 'black';
            ctx.fillRect(player.x + 5, player.y + 5, 2, 2);
            ctx.fillRect(player.x + player.width - 7, player.y + 5, 2, 2);
            ctx.fillStyle = '#2d2b26';
            ctx.font = 'bold 14px "Quicksand"';
            ctx.fillText(`⚡ ${streak}  x${multiplier}`, 8, 25);
            if (shieldActive) ctx.fillText('🛡️ SHIELD', canvas.width - 85, 25);
            ctx.restore();
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            updateGame();
            draw();
            animFrame = requestAnimationFrame(gameLoop);
        }
        
        function startGame() {
            if (gameRunning) stopGame();
            baseFallSpeed = modeSpeeds[selectedMode].fall;
            basePlayerSpeed = modeSpeeds[selectedMode].player;
            resetGame();
            gameRunning = true;
            startTime = Date.now();
            currentFallSpeed = baseFallSpeed;
            player.speed = basePlayerSpeed;
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            if (animFrame) cancelAnimationFrame(animFrame);
            animFrame = requestAnimationFrame(gameLoop);
        }
        
        function stopGame() {
            gameRunning = false;
            if (animFrame) cancelAnimationFrame(animFrame);
            keys.left = false;
            keys.right = false;
            resetGame();
            draw();
        }
        
        document.getElementById('startGameBtn')?.addEventListener('click', startGame);
        document.getElementById('stopGameBtn')?.addEventListener('click', stopGame);
        document.getElementById('muteBtn')?.addEventListener('click', () => {
            mute = !mute;
            document.getElementById('muteBtn').innerHTML = mute ? '🔇' : '🔊';
        });
        
        window.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                if (player.grounded && gameRunning) {
                    player.velY = player.jumpPower;
                    playSound('jump');
                }
            }
        });
        
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        });
        
        const leftBtn = document.getElementById('leftMoveBtn');
        const rightBtn = document.getElementById('rightMoveBtn');
        const jumpBtn = document.getElementById('jumpBtn');
        
        if (leftBtn) {
            leftBtn.addEventListener('mousedown', () => { if (gameRunning) keys.left = true; });
            leftBtn.addEventListener('mouseup', () => keys.left = false);
            leftBtn.addEventListener('mouseleave', () => keys.left = false);
        }
        if (rightBtn) {
            rightBtn.addEventListener('mousedown', () => { if (gameRunning) keys.right = true; });
            rightBtn.addEventListener('mouseup', () => keys.right = false);
            rightBtn.addEventListener('mouseleave', () => keys.right = false);
        }
        if (jumpBtn) {
            jumpBtn.addEventListener('click', () => {
                if (gameRunning && player.grounded) {
                    player.velY = player.jumpPower;
                    playSound('jump');
                }
            });
        }
        
        resetGame();
        draw();
    }, 200);
</script>
</body>
</html>
