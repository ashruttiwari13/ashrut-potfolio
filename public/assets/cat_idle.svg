<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="cozy-shadow-cat" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#3d3d3d" flood-opacity="0.18" />
    </filter>
    <linearGradient id="cloud-grad-cat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff0e6" />
    </linearGradient>
    <linearGradient id="cat-body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fedbb4" />
      <stop offset="100%" stop-color="#f8be86" />
    </linearGradient>
  </defs>

  <!-- Puffy Zen Cloud underneath -->
  <g filter="url(#cozy-shadow-cat)">
    <path d="M 45 195 
             C 30 195 20 180 30 165 
             C 25 150 45 140 60 148 
             C 75 135 110 135 125 148 
             C 140 135 175 135 190 150 
             C 210 145 225 160 215 178 
             C 225 192 210 205 195 200 
             C 180 208 60 208 45 195 Z" 
          fill="url(#cloud-grad-cat)" stroke="#3d3d3d" stroke-width="4.5" stroke-linejoin="round" />
  </g>

  <!-- Cute Curled Tail -->
  <path d="M 165 160 C 195 160, 208 135, 198 118 C 190 108, 178 114, 185 124 C 190 132, 182 148, 160 150" 
        fill="none" stroke="#f8be86" stroke-width="12" stroke-linecap="round" />
  <path d="M 165 160 C 195 160, 208 135, 198 118 C 190 108, 178 114, 185 124 C 190 132, 182 148, 160 150" 
        fill="none" stroke="#3d3d3d" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 999" />
  <path d="M 198 118 C 194 112, 184 116, 188 124" 
        fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />

  <!-- Back Ears -->
  <!-- Left Pointy Ear -->
  <path d="M 64 88 L 76 42 Q 95 56 100 82 Z" fill="#f8be86" stroke="#3d3d3d" stroke-width="4.5" stroke-linejoin="round" />
  <path d="M 72 82 L 80 52 Q 92 62 95 78 Z" fill="#ffaec0" />
  
  <!-- Right Pointy Ear with cute sakura flower -->
  <path d="M 176 88 L 164 42 Q 145 56 140 82 Z" fill="#f8be86" stroke="#3d3d3d" stroke-width="4.5" stroke-linejoin="round" />
  <path d="M 168 82 L 160 52 Q 148 62 145 78 Z" fill="#ffaec0" />
  <!-- Sakura blossom by ear -->
  <circle cx="166" cy="46" r="4.5" fill="#ffb6c1" stroke="#3d3d3d" stroke-width="1.5" />
  <circle cx="166" cy="46" r="1.8" fill="#ffd166" />

  <!-- Body (Fluffy round cat torso) -->
  <ellipse cx="120" cy="148" rx="56" ry="44" fill="url(#cat-body-grad)" stroke="#3d3d3d" stroke-width="4.5" />

  <!-- Cream White Fluffy Chest / Belly -->
  <ellipse cx="120" cy="154" rx="36" ry="30" fill="#fffcf5" stroke="#3d3d3d" stroke-width="3.5" />

  <!-- Back/Front Paws -->
  <!-- Left Paw with pink pads -->
  <ellipse cx="76" cy="172" rx="16" ry="12" fill="#f8be86" stroke="#3d3d3d" stroke-width="4" />
  <ellipse cx="76" cy="173" rx="7" ry="5.5" fill="#ffaec0" />
  <circle cx="70" cy="166" r="2.2" fill="#ffaec0" />
  <circle cx="76" cy="165" r="2.4" fill="#ffaec0" />
  <circle cx="82" cy="166" r="2.2" fill="#ffaec0" />

  <!-- Right Paw with pink pads -->
  <ellipse cx="164" cy="172" rx="16" ry="12" fill="#f8be86" stroke="#3d3d3d" stroke-width="4" />
  <ellipse cx="164" cy="173" rx="7" ry="5.5" fill="#ffaec0" />
  <circle cx="158" cy="166" r="2.2" fill="#ffaec0" />
  <circle cx="164" cy="165" r="2.4" fill="#ffaec0" />
  <circle cx="170" cy="166" r="2.2" fill="#ffaec0" />

  <!-- Head (Chubby & Adorable) -->
  <ellipse cx="120" cy="106" rx="54" ry="46" fill="url(#cat-body-grad)" stroke="#3d3d3d" stroke-width="4.5" />

  <!-- Cute Tabby Forehead Stripes -->
  <path d="M 120 70 L 120 82" stroke="#e08e4d" stroke-width="3" stroke-linecap="round" />
  <path d="M 111 73 L 114 83" stroke="#e08e4d" stroke-width="2.8" stroke-linecap="round" />
  <path d="M 129 73 L 126 83" stroke="#e08e4d" stroke-width="2.8" stroke-linecap="round" />

  <!-- Cheeks Muzzle -->
  <ellipse cx="111" cy="122" rx="13" ry="10" fill="#fffcf5" stroke="#3d3d3d" stroke-width="2.5" />
  <ellipse cx="129" cy="122" rx="13" ry="10" fill="#fffcf5" stroke="#3d3d3d" stroke-width="2.5" />

  <!-- Rosy Blushing Cheeks -->
  <ellipse cx="80" cy="120" rx="11" ry="7" fill="#ffb6c1" opacity="0.85" />
  <ellipse cx="160" cy="120" rx="11" ry="7" fill="#ffb6c1" opacity="0.85" />

  <!-- Sleeping Peaceful Arc Eyes (˘ ‿ ˘) -->
  <path d="M 90 106 Q 98 114 106 106" fill="none" stroke="#3d3d3d" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 134 106 Q 142 114 150 106" fill="none" stroke="#3d3d3d" stroke-width="3.5" stroke-linecap="round" />

  <!-- Tiny Cute Pink Nose -->
  <polygon points="116,116 124,116 120,121" fill="#ffaec0" stroke="#3d3d3d" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Cute Cat Whiskers -->
  <line x1="68" y1="116" x2="88" y2="118" stroke="#3d3d3d" stroke-width="2" stroke-linecap="round" />
  <line x1="66" y1="124" x2="88" y2="124" stroke="#3d3d3d" stroke-width="2" stroke-linecap="round" />
  <line x1="172" y1="116" x2="152" y2="118" stroke="#3d3d3d" stroke-width="2" stroke-linecap="round" />
  <line x1="174" y1="124" x2="152" y2="124" stroke="#3d3d3d" stroke-width="2" stroke-linecap="round" />
</svg>

