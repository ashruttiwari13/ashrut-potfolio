<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="panda-cozy-shadow-s2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1e2424" flood-opacity="0.22" />
    </filter>
    <linearGradient id="panda-cloud-grad-s2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
  </defs>

  <!-- Puffy Zen Cloud -->
  <g filter="url(#panda-cozy-shadow-s2)">
    <path d="M 45 195 
             C 30 195 20 180 30 165 
             C 25 150 45 140 60 148 
             C 75 135 110 135 125 148 
             C 140 135 175 135 190 150 
             C 210 145 225 160 215 178 
             C 225 192 210 205 195 200 
             C 180 208 60 208 45 195 Z" 
          fill="url(#panda-cloud-grad-s2)" stroke="#1e2424" stroke-width="4.5" stroke-linejoin="round" />
  </g>

  <!-- Ears (Tilted other side) -->
  <circle cx="72" cy="70" r="22" fill="#1e2424" stroke="#1e2424" stroke-width="4.5" />
  <circle cx="74" cy="72" r="10" fill="#ffaec0" />

  <circle cx="174" cy="66" r="22" fill="#1e2424" stroke="#1e2424" stroke-width="4.5" />
  <circle cx="172" cy="68" r="10" fill="#ffaec0" />
  <path d="M 184 48 C 198 38, 210 46, 204 56 C 194 56, 188 52, 184 48 Z" fill="#52b788" stroke="#1e2424" stroke-width="2.5" stroke-linejoin="round" />
  <circle cx="186" cy="46" r="2.5" fill="#ffd166" stroke="#1e2424" stroke-width="1.2" />

  <!-- Body -->
  <ellipse cx="120" cy="148" rx="54" ry="44" fill="#1e2424" stroke="#1e2424" stroke-width="4.5" />
  <ellipse cx="120" cy="154" rx="38" ry="32" fill="#ffffff" stroke="#1e2424" stroke-width="3.5" />

  <!-- Left Paw Resting on Cloud with Pink Pad -->
  <ellipse cx="80" cy="172" rx="16" ry="12" fill="#1e2424" stroke="#1e2424" stroke-width="4" />
  <ellipse cx="80" cy="173" rx="8" ry="6.5" fill="#ffaec0" />
  <circle cx="80" cy="164" r="2.4" fill="#ffaec0" />

  <!-- Right Paw Raised Joyfully Dancing (Matching cat sing 2) -->
  <ellipse cx="170" cy="154" rx="15" ry="13" fill="#1e2424" stroke="#1e2424" stroke-width="4" />
  <ellipse cx="170" cy="154" rx="8" ry="6.5" fill="#ffaec0" />
  <circle cx="170" cy="146" r="2.4" fill="#ffaec0" />

  <!-- Head (Tilted slightly right) -->
  <ellipse cx="122" cy="103" rx="56" ry="48" fill="#ffffff" stroke="#1e2424" stroke-width="4.5" />

  <!-- Eye Patches -->
  <ellipse cx="98" cy="99" rx="15" ry="19" fill="#1e2424" transform="rotate(-15 98 99)" />
  <ellipse cx="146" cy="99" rx="15" ry="19" fill="#1e2424" transform="rotate(15 146 99)" />

  <!-- Joyful Singing Winking Face (> ^) Exactly matching old cat picture -->
  <!-- Left Eye: Playful Wink (>) -->
  <path d="M 91 97 L 98 102 L 91 107" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Eye: Happy Singing Arc (^) -->
  <path d="M 139 101 Q 146 93 153 101" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

  <!-- Muzzle with Tongue Sticking Out (👅) -->
  <ellipse cx="122" cy="117" rx="15" ry="11" fill="#ffffff" stroke="#1e2424" stroke-width="2.5" />
  <polygon points="118,112 126,112 122,117" fill="#1e2424" stroke="#1e2424" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Mouth with Cute Sticking Out Tongue (Exactly as shown in reference) -->
  <path d="M 115 119 Q 122 123 122 119 Q 122 123 129 119" fill="none" stroke="#1e2424" stroke-width="2.5" stroke-linecap="round" />
  <!-- Pink Tongue sticking out below mouth -->
  <path d="M 118 120 C 118 126, 126 126, 126 120 Z" fill="#ff708f" stroke="#1e2424" stroke-width="2" stroke-linejoin="round" />

  <!-- Rosy Blushing Cheeks with Stripes -->
  <ellipse cx="78" cy="119" rx="11" ry="7" fill="#ffaec0" opacity="0.9" />
  <ellipse cx="166" cy="119" rx="11" ry="7" fill="#ffaec0" opacity="0.9" />
  <line x1="70" y1="116" x2="76" y2="116" stroke="#ffaec0" stroke-width="2" stroke-linecap="round" />
  <line x1="68" y1="122" x2="75" y2="122" stroke="#ffaec0" stroke-width="2" stroke-linecap="round" />
  <line x1="174" y1="116" x2="168" y2="116" stroke="#ffaec0" stroke-width="2" stroke-linecap="round" />
  <line x1="176" y1="122" x2="169" y2="122" stroke="#ffaec0" stroke-width="2" stroke-linecap="round" />
</svg>
