<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="cozy-shadow-sing2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1e2424" flood-opacity="0.16" />
    </filter>
    <linearGradient id="cloud-grad-sing2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8f5e9" />
    </linearGradient>
    <linearGradient id="bamboo-grad-sing2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#74c69d" />
      <stop offset="50%" stop-color="#95d5b2" />
      <stop offset="100%" stop-color="#52b788" />
    </linearGradient>
  </defs>

  <!-- Puffy Zen Cloud bouncing -->
  <g filter="url(#cozy-shadow-sing2)">
    <path d="M 45 195 
             C 30 195 20 180 30 165 
             C 25 150 45 140 60 148 
             C 75 135 110 135 125 148 
             C 140 135 175 135 190 150 
             C 210 145 225 160 215 178 
             C 225 192 210 205 195 200 
             C 180 208 60 208 45 195 Z" 
          fill="url(#cloud-grad-sing2)" stroke="#1e2424" stroke-width="4.5" stroke-linejoin="round" />
  </g>

  <!-- Back Ears (bobbed to the other side) -->
  <circle cx="72" cy="70" r="26" fill="#1e2424" stroke="#1e2424" stroke-width="5" />
  <circle cx="73" cy="69" r="14" fill="#2d373b" opacity="0.6" />
  <circle cx="168" cy="62" r="26" fill="#1e2424" stroke="#1e2424" stroke-width="5" />
  <circle cx="167" cy="61" r="14" fill="#2d373b" opacity="0.6" />

  <!-- Cute Bamboo Leaf behind ear fluttering -->
  <path d="M 174 44 C 192 28, 210 38, 206 52 C 192 54, 180 50, 174 44 Z" fill="#74c69d" stroke="#1e2424" stroke-width="3.5" stroke-linejoin="round" />
  <path d="M 174 44 Q 192 46, 204 50" fill="none" stroke="#2d6a4f" stroke-width="2" stroke-linecap="round" />

  <!-- Body -->
  <ellipse cx="120" cy="148" rx="58" ry="46" fill="#ffffff" stroke="#1e2424" stroke-width="5" />
  <path d="M 68 135 C 75 115, 165 115, 172 135 C 160 162, 80 162, 68 135 Z" fill="#1e2424" />
  <ellipse cx="120" cy="154" rx="38" ry="32" fill="#ffffff" stroke="#1e2424" stroke-width="4" />

  <!-- Feet Paws tapping in rhythm -->
  <ellipse cx="66" cy="174" rx="20" ry="15" fill="#1e2424" stroke="#1e2424" stroke-width="4.5" />
  <ellipse cx="66" cy="175" rx="10" ry="7.5" fill="#ffaec0" />
  <ellipse cx="174" cy="177" rx="20" ry="15" fill="#1e2424" stroke="#1e2424" stroke-width="4.5" />
  <ellipse cx="174" cy="178" rx="10" ry="7.5" fill="#ffaec0" />

  <!-- Head (tilted right in cute singing groove) -->
  <ellipse cx="122" cy="102" rx="58" ry="50" fill="#ffffff" stroke="#1e2424" stroke-width="5" />

  <!-- Eye Patches -->
  <ellipse cx="100" cy="98" rx="17" ry="21" fill="#1e2424" transform="rotate(-18 100 98)" />
  <ellipse cx="146" cy="98" rx="17" ry="21" fill="#1e2424" transform="rotate(16 146 98)" />

  <!-- Joyful Winking / Singing Eyes (^ ◡) -->
  <path d="M 93 99 Q 100 92 107 99" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <circle cx="145" cy="98" r="6.5" fill="#ffffff" />
  <circle cx="147.5" cy="95.5" r="2.8" fill="#ffffff" />

  <!-- Vibrant Rosy Blushing Cheeks -->
  <ellipse cx="82" cy="118" rx="13" ry="9" fill="#ff8fa3" opacity="0.95" />
  <ellipse cx="164" cy="118" rx="13" ry="9" fill="#ff8fa3" opacity="0.95" />

  <!-- Cute Nose -->
  <path d="M 116 108 C 119 105, 125 105, 128 108 C 130 112, 124 116, 122 116 C 120 116, 114 112, 116 108 Z" fill="#1e2424" />

  <!-- Singing Joyful Open Mouth with Tongue -->
  <path d="M 113 118 C 113 118, 122 115, 131 118 C 134 133, 110 133, 113 118 Z" fill="#1e2424" stroke="#1e2424" stroke-width="3.5" stroke-linejoin="round" />
  <path d="M 116 125 C 118 122, 126 122, 128 125 C 126 130, 118 130, 116 125 Z" fill="#ffaec0" />

  <!-- Bamboo Mic/Stalk tilted playfully the other way -->
  <g transform="rotate(10 105 130)">
    <rect x="100" y="98" width="13" height="65" rx="5.5" fill="url(#bamboo-grad-sing2)" stroke="#1e2424" stroke-width="3.5" />
    <line x1="99" y1="116" x2="114" y2="116" stroke="#1e2424" stroke-width="3" stroke-linecap="round" />
    <line x1="99" y1="138" x2="114" y2="138" stroke="#1e2424" stroke-width="3" stroke-linecap="round" />
    
    <!-- Microphone Top Leaf cluster -->
    <path d="M 106 96 C 95 84, 107 74, 113 85 C 111 92, 108 95, 106 96 Z" fill="#52b788" stroke="#1e2424" stroke-width="2.5" />
  </g>

  <!-- Left Paw holding mic playfully -->
  <ellipse cx="102" cy="135" rx="14" ry="11" fill="#1e2424" stroke="#1e2424" stroke-width="4.5" transform="rotate(-20 102 135)" />
  <circle cx="102" cy="135" r="4" fill="#ffaec0" />
  <!-- Right Paw waving enthusiastically in the air! -->
  <ellipse cx="168" cy="122" rx="15" ry="12" fill="#1e2424" stroke="#1e2424" stroke-width="4.5" transform="rotate(35 168 122)" />
  <circle cx="168" cy="122" r="4.5" fill="#ffaec0" />

  <!-- Floating Musical Melody Sparkles -->
  <g>
    <!-- Note 1 -->
    <text x="190" y="70" font-family="'Quicksand', sans-serif" font-weight="900" font-size="26" fill="#52b788">♩</text>
    <!-- Note 2 -->
    <text x="42" y="90" font-family="'Quicksand', sans-serif" font-weight="900" font-size="28" fill="#f5dd90">♫</text>
    <!-- Golden Sparkle Star -->
    <polygon points="185,100 188,107 195,108 190,113 192,120 185,116 178,120 180,113 175,108 182,107" fill="#ffd166" stroke="#1e2424" stroke-width="1.5" />
  </g>
</svg>

