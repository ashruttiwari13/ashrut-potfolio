<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Soft sticker drop shadow matching retro cat pin -->
    <filter id="panda-cozy-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1e2424" flood-opacity="0.22" />
    </filter>
    <linearGradient id="panda-cloud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
  </defs>

  <!-- Puffy White Cloud Pillow underneath (Exact cat shape) -->
  <g filter="url(#panda-cozy-shadow)">
    <path d="M 45 195 
             C 30 195 20 180 30 165 
             C 25 150 45 140 60 148 
             C 75 135 110 135 125 148 
             C 140 135 175 135 190 150 
             C 210 145 225 160 215 178 
             C 225 192 210 205 195 200 
             C 180 208 60 208 45 195 Z" 
          fill="url(#panda-cloud-grad)" stroke="#1e2424" stroke-width="4.5" stroke-linejoin="round" />
  </g>

  <!-- Cute Round Panda Ears -->
  <!-- Left Ear -->
  <circle cx="70" cy="68" r="22" fill="#1e2424" stroke="#1e2424" stroke-width="4.5" />
  <circle cx="72" cy="70" r="10" fill="#ffaec0" />

  <!-- Right Ear with cute bamboo leaf tucked behind tip -->
  <circle cx="170" cy="68" r="22" fill="#1e2424" stroke="#1e2424" stroke-width="4.5" />
  <circle cx="168" cy="70" r="10" fill="#ffaec0" />
  <!-- Cute little bamboo sprout accessory at ear tip -->
  <path d="M 178 48 C 192 38, 204 46, 198 56 C 188 56, 182 52, 178 48 Z" fill="#52b788" stroke="#1e2424" stroke-width="2.5" stroke-linejoin="round" />
  <circle cx="180" cy="46" r="2.5" fill="#ffd166" stroke="#1e2424" stroke-width="1.2" />

  <!-- Panda Body (Round fluffy chibi shape) -->
  <ellipse cx="120" cy="148" rx="54" ry="44" fill="#1e2424" stroke="#1e2424" stroke-width="4.5" />

  <!-- Chubby White Belly (Matches cat chest curve) -->
  <ellipse cx="120" cy="154" rx="38" ry="32" fill="#ffffff" stroke="#1e2424" stroke-width="3.5" />

  <!-- Front Paws Resting on Cloud with Pink Pads (Exact cat paws style) -->
  <!-- Left Paw -->
  <ellipse cx="80" cy="172" rx="16" ry="12" fill="#1e2424" stroke="#1e2424" stroke-width="4" />
  <ellipse cx="80" cy="173" rx="8" ry="6.5" fill="#ffaec0" />
  <circle cx="73" cy="166" r="2.2" fill="#ffaec0" />
  <circle cx="80" cy="164" r="2.4" fill="#ffaec0" />
  <circle cx="87" cy="166" r="2.2" fill="#ffaec0" />

  <!-- Right Paw -->
  <ellipse cx="160" cy="172" rx="16" ry="12" fill="#1e2424" stroke="#1e2424" stroke-width="4" />
  <ellipse cx="160" cy="173" rx="8" ry="6.5" fill="#ffaec0" />
  <circle cx="153" cy="166" r="2.2" fill="#ffaec0" />
  <circle cx="160" cy="164" r="2.4" fill="#ffaec0" />
  <circle cx="167" cy="166" r="2.2" fill="#ffaec0" />

  <!-- Head (Large, round, chubby chibi head) -->
  <ellipse cx="120" cy="104" rx="56" ry="48" fill="#ffffff" stroke="#1e2424" stroke-width="4.5" />

  <!-- Panda Teardrop Eye Patches -->
  <ellipse cx="96" cy="100" rx="15" ry="19" fill="#1e2424" transform="rotate(-15 96 100)" />
  <ellipse cx="144" cy="100" rx="15" ry="19" fill="#1e2424" transform="rotate(15 144 100)" />

  <!-- Idle Peaceful Smiling Arc Eyes (˘ ‿ ˘) inside patches -->
  <path d="M 89 100 Q 96 107 103 100" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 137 100 Q 144 107 151 100" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

  <!-- White Muzzle -->
  <ellipse cx="120" cy="118" rx="15" ry="11" fill="#ffffff" stroke="#1e2424" stroke-width="2.5" />

  <!-- Tiny Black Panda Nose -->
  <polygon points="116,113 124,113 120,118" fill="#1e2424" stroke="#1e2424" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Sweet Happy Cat-style Smile (:3) -->
  <path d="M 113 120 Q 120 125 120 119 Q 120 125 127 120" fill="none" stroke="#1e2424" stroke-width="2.5" stroke-linecap="round" />

  <!-- Rosy Blushing Cheeks -->
  <ellipse cx="76" cy="120" rx="11" ry="7" fill="#ffaec0" opacity="0.85" />
  <ellipse cx="164" cy="120" rx="11" ry="7" fill="#ffaec0" opacity="0.85" />
  <!-- Cute cheek stripes like cat -->
  <line x1="68" y1="117" x2="74" y2="117" stroke="#ffaec0" stroke-width="2" stroke-linecap="round" />
  <line x1="66" y1="123" x2="73" y2="123" stroke="#ffaec0" stroke-width="2" stroke-linecap="round" />
  <line x1="172" y1="117" x2="166" y2="117" stroke="#ffaec0" stroke-width="2" stroke-linecap="round" />
  <line x1="174" y1="123" x2="167" y2="123" stroke="#ffaec0" stroke-width="2" stroke-linecap="round" />
</svg>
