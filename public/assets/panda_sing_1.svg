<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="cozy-shadow-sing" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1e2424" flood-opacity="0.16" />
    </filter>
    <linearGradient id="cloud-grad-sing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8f5e9" />
    </linearGradient>
    <linearGradient id="bamboo-grad-sing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#74c69d" />
      <stop offset="50%" stop-color="#95d5b2" />
      <stop offset="100%" stop-color="#52b788" />
    </linearGradient>
  </defs>

  <!-- Puffy Zen Cloud -->
  <g filter="url(#cozy-shadow-sing)">
    <path d="M 45 195 
             C 30 195 20 180 30 165 
             C 25 150 45 140 60 148 
             C 75 135 110 135 125 148 
             C 140 135 175 135 190 150 
             C 210 145 225 160 215 178 
             C 225 192 210 205 195 200 
             C 180 208 60 208 45 195 Z" 
          fill="url(#cloud-grad-sing)" stroke="#1e2424" stroke-width="4.5" stroke-linejoin="round" />
  </g>

  <!-- Back Ears (wiggling with joy) -->
  <circle cx="64" cy="62" r="26" fill="#1e2424" stroke="#1e2424" stroke-width="5" />
  <circle cx="65" cy="61" r="14" fill="#2d373b" opacity="0.6" />
  <circle cx="176" cy="72" r="26" fill="#1e2424" stroke="#1e2424" stroke-width="5" />
  <circle cx="175" cy="71" r="14" fill="#2d373b" opacity="0.6" />

  <!-- Cute Bamboo Leaf behind ear wiggling -->
  <path d="M 182 50 C 200 36, 218 46, 214 60 C 200 62, 188 58, 182 50 Z" fill="#52b788" stroke="#1e2424" stroke-width="3.5" stroke-linejoin="round" />
  <path d="M 182 50 Q 200 52 212 58" fill="none" stroke="#2d6a4f" stroke-width="2" stroke-linecap="round" />

  <!-- Body -->
  <ellipse cx="120" cy="148" rx="58" ry="46" fill="#ffffff" stroke="#1e2424" stroke-width="5" />
  <path d="M 68 135 C 75 115, 165 115, 172 135 C 160 162, 80 162, 68 135 Z" fill="#1e2424" />
  <ellipse cx="120" cy="154" rx="38" ry="32" fill="#ffffff" stroke="#1e2424" stroke-width="4" />

  <!-- Feet Paws -->
  <ellipse cx="62" cy="176" rx="20" ry="15" fill="#1e2424" stroke="#1e2424" stroke-width="4.5" />
  <ellipse cx="62" cy="177" rx="10" ry="7.5" fill="#ffaec0" />
  <ellipse cx="178" cy="176" rx="20" ry="15" fill="#1e2424" stroke="#1e2424" stroke-width="4.5" />
  <ellipse cx="178" cy="177" rx="10" ry="7.5" fill="#ffaec0" />

  <!-- Head (tilted slightly singing) -->
  <ellipse cx="118" cy="102" rx="58" ry="50" fill="#ffffff" stroke="#1e2424" stroke-width="5" />

  <!-- Eye Patches -->
  <ellipse cx="94" cy="98" rx="17" ry="21" fill="#1e2424" transform="rotate(-15 94 98)" />
  <ellipse cx="140" cy="98" rx="17" ry="21" fill="#1e2424" transform="rotate(20 140 98)" />

  <!-- Joyful Singing Closed Happy Arc Eyes (^ ^) -->
  <path d="M 87 99 Q 94 92 101 99" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <path d="M 133 99 Q 140 92 147 99" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <!-- Vibrant Rosy Blushing Cheeks -->
  <ellipse cx="76" cy="118" rx="13" ry="9" fill="#ff8fa3" opacity="0.9" />
  <ellipse cx="158" cy="118" rx="13" ry="9" fill="#ff8fa3" opacity="0.9" />

  <!-- Cute Nose -->
  <path d="M 112 108 C 115 105, 121 105, 124 108 C 126 112, 120 116, 118 116 C 116 116, 110 112, 112 108 Z" fill="#1e2424" />

  <!-- Open Singing Mouth with Pink Tongue :D -->
  <path d="M 109 119 C 109 119, 118 116, 127 119 C 130 133, 106 133, 109 119 Z" fill="#1e2424" stroke="#1e2424" stroke-width="3.5" stroke-linejoin="round" />
  <path d="M 112 126 C 114 123, 122 123, 124 126 C 122 131, 114 131, 112 126 Z" fill="#ffaec0" />

  <!-- Bamboo Mic/Stalk held upright like a microphone! -->
  <g transform="rotate(-12 140 130)">
    <rect x="135" y="98" width="13" height="65" rx="5.5" fill="url(#bamboo-grad-sing)" stroke="#1e2424" stroke-width="3.5" />
    <line x1="134" y1="116" x2="149" y2="116" stroke="#1e2424" stroke-width="3" stroke-linecap="round" />
    <line x1="134" y1="138" x2="149" y2="138" stroke="#1e2424" stroke-width="3" stroke-linecap="round" />
    
    <!-- Microphone Top Leaf cluster -->
    <path d="M 141 96 C 130 84, 142 74, 148 85 C 146 92, 143 95, 141 96 Z" fill="#52b788" stroke="#1e2424" stroke-width="2.5" />
    <path d="M 145 96 C 160 86, 168 98, 154 104 C 148 102, 146 98, 145 96 Z" fill="#74c69d" stroke="#1e2424" stroke-width="2.5" />
  </g>

  <!-- Left Paw raised singing / gesturing -->
  <ellipse cx="80" cy="130" rx="15" ry="12" fill="#1e2424" stroke="#1e2424" stroke-width="4.5" transform="rotate(-35 80 130)" />
  <circle cx="79" cy="130" r="4.5" fill="#ffaec0" />
  <!-- Right Paw holding the mic -->
  <ellipse cx="140" cy="135" rx="14" ry="11" fill="#1e2424" stroke="#1e2424" stroke-width="4.5" transform="rotate(25 140 135)" />
  <circle cx="141" cy="135" r="4" fill="#ffaec0" />

  <!-- Floating Musical Melody Sparkles -->
  <g>
    <!-- Note 1 -->
    <text x="32" y="78" font-family="'Quicksand', sans-serif" font-weight="900" font-size="24" fill="#52b788">♪</text>
    <!-- Note 2 -->
    <text x="195" y="85" font-family="'Quicksand', sans-serif" font-weight="900" font-size="28" fill="#ffaec0">♫</text>
    <!-- Little bamboo leaf floating -->
    <path d="M 44 106 C 54 98, 62 102, 60 110 C 52 112, 46 110, 44 106 Z" fill="#52b788" stroke="#1e2424" stroke-width="2" />
  </g>
</svg>

