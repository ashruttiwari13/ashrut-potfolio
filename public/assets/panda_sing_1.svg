<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="panda-cozy-shadow-s1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1e2424" flood-opacity="0.22" />
    </filter>
    <linearGradient id="panda-cloud-grad-s1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
  </defs>

  <!-- Puffy Zen Cloud -->
  <g filter="url(#panda-cozy-shadow-s1)">
    <path d="M 45 195 
             C 30 195 20 180 30 165 
             C 25 150 45 140 60 148 
             C 75 135 110 135 125 148 
             C 140 135 175 135 190 150 
             C 210 145 225 160 215 178 
             C 225 192 210 205 195 200 
             C 180 208 60 208 45 195 Z" 
          fill="url(#panda-cloud-grad-s1)" stroke="#1e2424" stroke-width="4.5" stroke-linejoin="round" />
  </g>

  <!-- Ears (Tilted slightly in bounce) -->
  <circle cx="68" cy="66" r="22" fill="#1e2424" stroke="#1e2424" stroke-width="4.5" />
  <circle cx="70" cy="68" r="10" fill="#ffaec0" />

  <circle cx="172" cy="70" r="22" fill="#1e2424" stroke="#1e2424" stroke-width="4.5" />
  <circle cx="170" cy="72" r="10" fill="#ffaec0" />
  <path d="M 180 50 C 194 40, 206 48, 200 58 C 190 58, 184 54, 180 50 Z" fill="#52b788" stroke="#1e2424" stroke-width="2.5" stroke-linejoin="round" />
  <circle cx="182" cy="48" r="2.5" fill="#ffd166" stroke="#1e2424" stroke-width="1.2" />

  <!-- Body -->
  <ellipse cx="120" cy="148" rx="54" ry="44" fill="#1e2424" stroke="#1e2424" stroke-width="4.5" />
  <ellipse cx="120" cy="154" rx="38" ry="32" fill="#ffffff" stroke="#1e2424" stroke-width="3.5" />

  <!-- Right Paw Resting on Cloud with Pink Pad -->
  <ellipse cx="160" cy="172" rx="16" ry="12" fill="#1e2424" stroke="#1e2424" stroke-width="4" />
  <ellipse cx="160" cy="173" rx="8" ry="6.5" fill="#ffaec0" />
  <circle cx="160" cy="164" r="2.4" fill="#ffaec0" />

  <!-- Left Paw Raised Cheerful Singing (Matching cat sing 1) -->
  <ellipse cx="70" cy="154" rx="15" ry="13" fill="#1e2424" stroke="#1e2424" stroke-width="4" />
  <ellipse cx="70" cy="154" rx="8" ry="6.5" fill="#ffaec0" />
  <circle cx="70" cy="146" r="2.4" fill="#ffaec0" />

  <!-- Head (Tilted slightly left) -->
  <ellipse cx="118" cy="103" rx="56" ry="48" fill="#ffffff" stroke="#1e2424" stroke-width="4.5" />

  <!-- Eye Patches -->
  <ellipse cx="94" cy="99" rx="15" ry="19" fill="#1e2424" transform="rotate(-15 94 99)" />
  <ellipse cx="142" cy="99" rx="15" ry="19" fill="#1e2424" transform="rotate(15 142 99)" />

  <!-- Joyful Singing Closed Happy Arc Eyes (^ ^) -->
  <path d="M 87 101 Q 94 93 101 101" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 135 101 Q 142 93 149 101" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

  <!-- Muzzle -->
  <ellipse cx="118" cy="117" rx="15" ry="11" fill="#ffffff" stroke="#1e2424" stroke-width="2.5" />
  <polygon points="114,112 122,112 118,117" fill="#1e2424" stroke="#1e2424" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Open Singing Mouth with Pink Tongue -->
  <path d="M 112 119 Q 118 131 124 119 Z" fill="#ff708f" stroke="#1e2424" stroke-width="2.5" stroke-linejoin="round" />
  <circle cx="118" cy="125" r="3.2" fill="#ffaec0" />

  <!-- Blushing Cheeks -->
  <ellipse cx="74" cy="119" rx="11" ry="7" fill="#ffaec0" opacity="0.9" />
  <ellipse cx="162" cy="119" rx="11" ry="7" fill="#ffaec0" opacity="0.9" />
  <line x1="66" y1="116" x2="72" y2="116" stroke="#ffaec0" stroke-width="2" stroke-linecap="round" />
  <line x1="64" y1="122" x2="71" y2="122" stroke="#ffaec0" stroke-width="2" stroke-linecap="round" />
  <line x1="170" y1="116" x2="164" y2="116" stroke="#ffaec0" stroke-width="2" stroke-linecap="round" />
  <line x1="172" y1="122" x2="165" y2="122" stroke="#ffaec0" stroke-width="2" stroke-linecap="round" />
</svg>
