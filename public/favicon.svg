<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1e2424" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background rounded squircle in soft bamboo mint -->
  <rect width="128" height="128" rx="36" fill="#e8f5e9" stroke="#1e2424" stroke-width="5" />
  
  <!-- Bamboo leaf decoration in corner -->
  <path d="M 22 28 C 30 14, 48 18, 52 28 C 44 32, 28 36, 22 28 Z" fill="#52b788" stroke="#1e2424" stroke-width="3" stroke-linejoin="round" />
  <path d="M 22 28 Q 38 24 50 28" fill="none" stroke="#2d6a4f" stroke-width="2" stroke-linecap="round" />

  <!-- Panda Ears -->
  <circle cx="36" cy="38" r="18" fill="#1e2424" stroke="#1e2424" stroke-width="4" />
  <circle cx="37" cy="37" r="10" fill="#323a3f" opacity="0.6" />
  <circle cx="92" cy="38" r="18" fill="#1e2424" stroke="#1e2424" stroke-width="4" />
  <circle cx="91" cy="37" r="10" fill="#323a3f" opacity="0.6" />

  <!-- Panda Head -->
  <circle cx="64" cy="72" r="42" fill="#ffffff" stroke="#1e2424" stroke-width="5" />

  <!-- Black Eye Patches -->
  <!-- Left Eye Patch (tilted oval) -->
  <ellipse cx="49" cy="69" rx="13" ry="16" fill="#1e2424" transform="rotate(-18 49 69)" />
  <!-- Right Eye Patch (tilted oval) -->
  <ellipse cx="79" cy="69" rx="13" ry="16" fill="#1e2424" transform="rotate(18 79 69)" />

  <!-- Sparkling Eyes -->
  <circle cx="51" cy="68" r="5" fill="#ffffff" />
  <circle cx="53" cy="66" r="2.2" fill="#ffffff" />
  <circle cx="77" cy="68" r="5" fill="#ffffff" />
  <circle cx="79" cy="66" r="2.2" fill="#ffffff" />

  <!-- Rosy Blush Cheeks -->
  <ellipse cx="37" cy="84" rx="8" ry="5.5" fill="#ffaec0" opacity="0.75" />
  <ellipse cx="91" cy="84" rx="8" ry="5.5" fill="#ffaec0" opacity="0.75" />

  <!-- Cute Nose -->
  <path d="M 60 77 C 62 75, 66 75, 68 77 C 69 79, 65 83, 64 83 C 63 83, 59 79, 60 77 Z" fill="#1e2424" />

  <!-- Happy Mouth -->
  <path d="M 58 85 Q 64 89 64 83 Q 64 89 70 85" fill="none" stroke="#1e2424" stroke-width="3" stroke-linecap="round" />
</svg>
