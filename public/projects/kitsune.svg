<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="kit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="50%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#kit-bg)"/>
  <!-- Torii Gate silhouette -->
  <g stroke="#3d3d3d" stroke-width="8" stroke-linecap="round">
    <line x1="280" y1="140" x2="520" y2="140"/>
    <line x1="260" y1="120" x2="540" y2="120"/>
    <line x1="320" y1="120" x2="320" y2="380"/>
    <line x1="480" y1="120" x2="480" y2="380"/>
  </g>
  <!-- Kitsune Mask / character -->
  <g transform="translate(400, 240)">
    <circle cx="0" cy="0" r="60" fill="#ffffff" stroke="#3d3d3d" stroke-width="4"/>
    <!-- Ears -->
    <polygon points="-45,-30 -60,-80 -20,-50" fill="#ffffff" stroke="#3d3d3d" stroke-width="4"/>
    <polygon points="45,-30 60,-80 20,-50" fill="#ffffff" stroke="#3d3d3d" stroke-width="4"/>
    <!-- Red face markings -->
    <path d="M-30,-10 Q-15,-20 0,-10" stroke="#f43f5e" stroke-width="4" fill="none"/>
    <path d="M30,-10 Q15,-20 0,-10" stroke="#f43f5e" stroke-width="4" fill="none"/>
    <ellipse cx="-20" cy="5" rx="8" ry="4" fill="#3d3d3d"/>
    <ellipse cx="20" cy="5" rx="8" ry="4" fill="#3d3d3d"/>
    <circle cx="0" cy="22" r="5" fill="#f43f5e"/>
  </g>
  <!-- Title Badge -->
  <rect x="230" y="380" width="340" height="46" rx="23" fill="#fef9e7" stroke="#3d3d3d" stroke-width="3"/>
  <text x="400" y="409" font-family="'Quicksand', sans-serif" font-weight="bold" font-size="18" fill="#3d3d3d" text-anchor="middle">KITSUNE 3D · CHARACTER SCULPT</text>
</svg>
